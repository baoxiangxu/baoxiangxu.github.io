:root{

  --f-disp:"Noto Serif SC","Songti SC","STSong",serif;

}

  --accent:#8EA9FF; --accent-ink:#0D1218; --accent-soft:#1E2A47; --ochre:#E0A64A; --pick:#FF8F45;
  --good:#52C68D; --good-soft:#15301F; --bad:#F2847A; --bad-soft:#3A1C1A; --warn:#E5B04F; --warn-soft:#352812;
  --s1:#8EA9FF; --s2:#FB8B5A; --s3:#4FD1C5; --s4:#B79CFF; --s5:#E3B341; --s6:#F472B6; --s7:#A3D35B; --s8:#5EC2F5; --s9:#B8B2AC; --s10:#FDA4AF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B23; --soft:#1B2430; --ink:#E4E9EF; --muted:#94A1B0; --line:#26313D;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

.fact.good{background:var(--good-soft);color:var(--good)} .fact.bad{background:var(--bad-soft);color:var(--bad)} .fact.warn{background:var(--warn-soft);color:var(--warn)}

.rg .adm{color:var(--accent)}.rg .due{color:var(--accent);font-weight:600}.rg .good{color:var(--good)}.rg .bad{color:var(--bad)}.rg .warn{color:var(--warn,#b26b00)}

.stamp .v.na{color:var(--muted);font-weight:400;font-size:14px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 10px;font-size:13px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

<script>
/* 中英切换：英文模式下，界面和数据文字在显示时换成英文；筛选、排序、计数仍用中文原数据计算，结果和中文版完全一样。
   切分规则与 i18n/seg.py 一致：按中文标点切成句段，数字换成 ⟨1⟩⟨2⟩… 后查表。 */
(function(){
  let LS=null;try{LS=window.localStorage}catch(e){}
  let lang='zh';try{lang=JSON.parse(LS.getItem('xzt.lang'))||'zh'}catch(e){}
  const H=document.documentElement;
  const I={lang,on:lang==='en',D:new Map(),miss:new Map(),memo:new Map(),files:{},tx:s=>s,tr:s=>s,ready:Promise.resolve()};
  window.I18N=I;
  document.addEventListener('click',e=>{if(e.target&&e.target.id==='langBtn'){try{LS.setItem('xzt.lang',JSON.stringify(I.on?'zh':'en'))}catch(err){}location.reload()}});
  const setBtn=()=>{const b=document.getElementById('langBtn');if(b){b.textContent=I.on?'中文':'EN';b.title=I.on?'切换到中文':'Switch to English'}};
  setBtn();
  if(!I.on){H.classList.remove('i18n-wait');return}
  H.lang='en';
  const CJK=/[㐀-䶿一-鿿]/;
  const DELIM=/([。；！？\n｜（）〔〕【】：，、;]+)/;
  const NUM=/(?<![0-9.,])[0-9]+(?:[.,][0-9]+)*(?![0-9.,]|\s*月)/g;
  const PM={'。':'. ','；':'; ',';':'; ','！':'! ','？':'? ','｜':' | ','（':' (','）':') ','〔':' [','〕':'] ','【':' [','】':'] ','：':': ','，':', ','、':', ','\n':'\n'};
  const FW={'／':'/','＋':'+','～':'~','＝':'=','％':'%','＜':'<','＞':'>','＆':'&','＃':'#','＊':'*','「':'"','」':'"','『':'"','』':'"','“':'"','”':'"','　':' ','——':' — ','（':' (','）':') ','：':': ','，':', ','；':'; ','、':', ','。':'. '};
  const FWT=/[／＋～＝％＜＞＆＃＊「」『』“”　（）：，；、。]|——/, FWG=/[／＋～＝％＜＞＆＃＊「」『』“”　（）：，；、。]|——/g;
  const tidy=t=>t.replace(/[  ]{2,}/g,' ').replace(/ ([,.;:!?)\]])/g,'$1').replace(/([(\[]) /g,'$1').replace(/([,;:]) ?([,;:.])/g,'$2');
  let CURS='';const OUTS=new Set();/* 半译的结果：代码先翻再截短写进页面的，不再重复处理 */
  /* 句式模板：键里的 {*} 可以是任意文字（学校名、榜单名…），先套模板，再把 {*} 里的文字单独翻译 */
  const PAT=[];let DEPTH=0;
  function look(core){const nums=[];
    const key=core.replace(NUM,m=>{nums.push(m);return '⟨'+nums.length+'⟩'});
    let en=I.D.get(key);
    if(en==null&&PAT.length&&DEPTH<3){for(const [re,t] of PAT){const m=re.exec(key);if(!m)continue;
      DEPTH++;try{const g=m.slice(1).map(x=>tr(x.replace(/⟨(\d+)⟩/g,(z,k)=>nums[k-1]??z)));en=t.replace(/\{(\d)\}/g,(z,k)=>g[k-1]??z)}finally{DEPTH--}break}}
    if(en==null)return null;
    if(nums.length)en=en.replace(/⟨(\d+)⟩/g,(m,k)=>nums[k-1]??m);return en}
  const EDGE=/^([^\p{L}\p{N}]*)([\s\S]*?)([^\p{L}\p{N}]*)$/u, SUB=/(\s*[·•]\s*|\s+[-–—→]\s+|\s*[／/]\s*|\s*[＋+]\s*|\u3000+)/;
  function look2(core){let en=look(core);if(en!=null)return en;
    const m=EDGE.exec(core);if(m&&(m[1]||m[3])&&m[2]&&CJK.test(m[2])){en=look(m[2]);if(en!=null)return m[1]+en+m[3]}

  async function ghPutPrivate(ctx,obj,message){const t=obj.t,blob=await seal(obj,ctx.bits,unb64(ctx.cur.salt),ctx.cur.iter,t);
    const r=await ghPut(ctx,FPATH,B64(te.encode(JSON.stringify(blob))),ctx.sha,message);
    if(r.ok){keepKey(ctx.bits,ctx.cur.salt,ctx.cur.iter);set('__privts',t);BLOB=blob}
    return r}
  const putErr=r=>r.status===0?'连不上 GitHub，检查一下网络':(r.status===409||r.status===422)?'网站上的文件刚刚被改过，请再试一次':(ghBad(r.status)||`保存失败（${r.status}）`);
  const stamp=()=>new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';

  /* —— 弹窗里共用的「钥匙」「密码」输入 —— */
  const tokBox=()=>`<div class="box"><b>第一次用：粘贴你的 GitHub 钥匙</b>
        <ol class="small" style="margin:6px 0 8px;padding-left:20px;line-height:1.6">
        <li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 生成钥匙的页面</a>，要先登录 GitHub</li>
        <li>名字随便写，比如 phd-site；有效期选一个你能接受的</li>
        <li>Repository access 选 Only select repositories，再选 baoxiangxu.github.io</li>
        <li>Permissions 里加上 Contents，权限选 Read and write</li>
        <li>点 Generate token，复制 github_pat_ 开头的那一串，粘到下面</li></ol>
        <input type="password" id="svTok" class="inp" placeholder="github_pat_…" autocomplete="off" spellcheck="false" style="width:100%;box-sizing:border-box">
        <p class="small muted" style="margin:6px 0 0">钥匙只存在这个浏览器里，只能改这一个网站仓库。没有钥匙的人（比如老师）保存不了，改动只留在他们自己的浏览器里。</p></div>`;
  const tokHave=()=>`<p class="small muted" style="margin:0">这个浏览器里已经存了你的 GitHub 钥匙。<button class="linkbtn" id="svForget" type="button">删掉钥匙</button></p>`;
  const pwField=()=>`<input type="password" id="svPw" class="inp" placeholder="私人访问密码" autocomplete="current-password" style="width:100%;box-sizing:border-box;margin:8px 0 0">`;
  const sm=(t,c)=>{const e=document.getElementById('svMsg');if(e){e.textContent=t;e.className='xmsg'+(c?' '+c:'')}};
  function closeSave(){const g=document.getElementById('saveDlg');if(g)g.remove()}
  /* kind: save（保存清单）| add（添加资料）| del（删除资料） */
  let DLG={kind:'save'};
  function dlg(kind,extra){closeSave();DLG=Object.assign({kind},extra||{});const tok=ghTok(),k=sesKey(),d=document.createElement('div');d.className='xfer';d.id='saveDlg';
    const f=kind==='del'?FILES().find(x=>x.id===DLG.id):null;
    const title=kind==='save'?'保存到网站':kind==='add'?'添加个人资料':'删除个人资料';
    const intro=kind==='save'?`<p class="note" style="margin:0 0 8px">把这里现在的选择（${summ(snapNow())}）加密后存到网站上。保存后 1–2 分钟，所有用密码打开的人都会看到新清单。</p>`
      :kind==='add'?`<p class="note" style="margin:0 0 10px">先写标题，再选文件（最大 25 MB）。文件会在你的浏览器里加密后再上传，只有输入密码的人能下载。</p>
        <label class="small" for="docTitle" style="display:block;margin:0 0 4px;font-weight:600">标题</label>
        <input type="text" id="docTitle" class="inp" placeholder="比如 CV、Personal Statement、成绩单" autocomplete="off" style="width:100%;box-sizing:border-box;margin:0 0 10px">
        <label class="small" style="display:block;margin:0 0 4px;font-weight:600">文件</label>
        <div class="xrow" style="margin:0 0 12px"><label class="btn" for="docFile" style="cursor:pointer">选择文件</label><span id="docFileName" class="small muted">还没选文件</span>
        <input type="file" id="docFile" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></div>`
      :`<p class="note" style="margin:0 0 8px">从网站上删掉 <b data-noi18n>${esc0(f?(f.title||f.name):'')}</b>？删掉后用密码打开的人也下载不到了。</p>`;
    d.innerHTML=`<div class="xfer-in" role="dialog" aria-modal="true" aria-labelledby="svT"><h3 id="svT">${title}</h3>${intro}
      <form id="svForm" autocomplete="off">${tok?tokHave():tokBox()}
      <div id="svPwBox">${k?'':pwField()}</div>
      <p class="xmsg" id="svMsg"></p>
      <div class="xrow" style="justify-content:flex-end"><button class="btn" id="svCancel" type="button">关闭</button><button class="btn pri" id="svGo" type="submit">${kind==='save'?'保存':kind==='add'?'上传':'删除'}</button></div></form></div>`;
    document.body.appendChild(d);setTimeout(()=>{const x=document.getElementById(kind==='add'?'docTitle':tok?(k?'svGo':'svPw'):'svTok');if(x)x.focus()},50)}
  const esc0=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const saveDlg=()=>dlg('save');
  window.XSITE={dirty(k){if(get('__mode')!=='private'||!DK.has(k))return;if(!isDirty()){set('__dirty',1)}saveBtn()},save:()=>saveDlg(),docsHtml:()=>docsHtml()};

  let BUSY=false;
  async function run(){if(BUSY)return;const go=document.getElementById('svGo'),force=go&&go.dataset.force==='1';
    const tokIn=document.getElementById('svTok'),pwIn=document.getElementById('svPw');
    const tok=ghTok()||(tokIn?tokIn.value.trim():'');
    if(!tok){sm('先粘贴 GitHub 钥匙','bad');return}
    if(!(window.crypto&&crypto.subtle)){sm('这个浏览器不支持加密，请换用新版 Chrome、Safari 或 Edge','bad');return}
    let picked=[];
    let docTitle='';
    if(DLG.kind==='add'){const fi=document.getElementById('docFile');picked=fi?[...fi.files].slice(0,1):[];
      docTitle=((document.getElementById('docTitle')||{}).value||'').trim();
      if(!docTitle){sm('先写标题，比如 CV','bad');const x=document.getElementById('docTitle');if(x)x.focus();return}
      if(!picked.length){sm('先选要上传的文件','bad');return}
      const big=picked.find(x=>x.size>25*1024*1024);if(big){sm(`有文件超过 25 MB，传不了：${big.name}`,'bad');return}}
    BUSY=true;if(go)go.disabled=true;
    try{
      const ctx=await ghOpen(tok,pwIn?pwIn.value:'',t=>sm(t));
      if(ctx.err){if(ctx.needPw&&!pwIn){document.getElementById('svPwBox').innerHTML=pwField();const p=document.getElementById('svPw');if(p)p.focus()}
        sm(ctx.err,'bad');if(ctx.st===401&&!tokIn){try{LS.removeItem('xzt_gh')}catch(e){}}return}
      const remember=()=>{if(tokIn){try{LS.setItem('xzt_gh',tok)}catch(e){}}const tb=document.querySelector('#saveDlg .box');if(tb)tb.remove()};
      const files=Array.isArray(ctx.obj.f)?ctx.obj.f.slice():[];
      if(DLG.kind==='save'){
        const mine=+get('__privts')||0;
        if(!force&&ctx.cur.t&&+ctx.cur.t>mine){sm(`网站上的清单在 ${fmtT(ctx.cur.t)} 保存过，比你这里载入的版本新（可能是在别的电脑上改的）。再点「仍然保存」会用这里的版本覆盖它。`,'bad');if(go){go.textContent='仍然保存';go.dataset.force='1'}return}
        sm('正在加密并保存…');
        const r=await ghPutPrivate(ctx,{t:Date.now(),d:snapNow(),f:files},'Update Econ PhD picks from the web ('+stamp()+')');
        if(!r.ok){sm(putErr(r),'bad');return}
        remember();set('__files',files);try{LS.removeItem('xzt.__dirty')}catch(e){}saveBtn();rerender();
        sm('✓ 已保存。GitHub 正在重新生成网站，1–2 分钟后所有人都能看到新清单。','ok');if(go){go.textContent='保存';go.dataset.force=''}
      }else if(DLG.kind==='add'){
        let n=0;
        for(const fl of picked){n++;sm(`正在加密并上传 ${n}/${picked.length}：${fl.name}…`);
          const key=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));
          const ak=await S().importKey('raw',key,'AES-GCM',false,['encrypt']);
          const ct=new Uint8Array(await S().encrypt({name:'AES-GCM',iv},ak,await fl.arrayBuffer()));
          const out=new Uint8Array(5+12+ct.length);out.set(te.encode('XZTF1'),0);out.set(iv,5);out.set(ct,17);
          const id=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
          const r=await ghPut(ctx,FDIR+id+'.bin',B64(out),null,'Add encrypted file ('+stamp()+')');
          if(!r.ok){sm(putErr(r),'bad');return}
          files.push({id,title:docTitle,name:fl.name,size:fl.size,type:fl.type||'',t:Date.now(),k:B64(key)})}
        sm('正在更新资料列表…');
        const r=await ghPutPrivate(ctx,{t:Date.now(),d:ctx.obj.d||{},f:files},'Update file list ('+stamp()+')');
        if(!r.ok){sm(putErr(r),'bad');return}
        remember();set('__files',files);rerender();const fi=document.getElementById('docFile');if(fi)fi.value='';
        const dt=document.getElementById('docTitle');if(dt)dt.value='';const fn=document.getElementById('docFileName');if(fn){fn.removeAttribute('data-noi18n');fn.textContent='还没选文件'}
        sm(`✓ 已上传「${docTitle}」。网站 1–2 分钟后更新，之后用密码打开的人都能下载。可以接着传下一个。`,'ok');
      }else{
        const f=files.find(x=>x.id===DLG.id);
        if(f){sm('正在删除…');const p=FDIR+f.id+'.bin';
          try{const g=await fetch(ghURL(p)+'?ref='+encodeURIComponent(BR),{headers:ctx.H,cache:'no-store'});
            if(g.ok){const gj=await g.json();const r=await fetch(ghURL(p),{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},ctx.H),body:JSON.stringify({message:'Delete encrypted file ('+stamp()+')',sha:gj.sha,branch:BR})});if(!r.ok&&r.status!==404){sm(putErr(r),'bad');return}}}
          catch(e){sm('连不上 GitHub，检查一下网络','bad');return}}
        const keep=files.filter(x=>x.id!==DLG.id);
        const r=await ghPutPrivate(ctx,{t:Date.now(),d:ctx.obj.d||{},f:keep},'Update file list ('+stamp()+')');
        if(!r.ok){sm(putErr(r),'bad');return}
        remember();set('__files',keep);rerender();sm('✓ 已删除','ok');if(go)go.remove()}
    }catch(e){sm('出错了：'+(e.message||e),'bad')}
    finally{BUSY=false;if(go)go.disabled=false}}

  /* —— 「我的清单」里的个人资料区 —— */
  const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  function docsHtml(){if(get('__mode')!=='private')return '';const fs=FILES(),own=!!ghTok();
    if(!fs.length&&!own)return '';
    return `<section class="pk-docs"><div class="pk-th"><h3>个人资料</h3><span class="small muted">${fs.length?`${fs.length} 个文件 · 只有输入密码的人能下载`:'还没有上传资料'}</span>${own?'<button class="btn" id="docAdd" type="button">＋ 添加资料</button>':''}</div>
      ${fs.length?`<ul class="pk-dl">${fs.map(f=>`<li><span class="pk-fn">📄 <span data-noi18n>${esc0(f.title||f.name)}</span></span>${f.title?`<span class="small muted" data-noi18n>${esc0(f.name)}</span>`:''}<span class="small muted">${fmtSize(f.size)} · ${esc0(new Date(f.t).toLocaleDateString())}</span><span class="pk-acts"><button class="btn" data-docdl="${esc0(f.id)}" type="button">下载</button>${own?`<button class="btn" data-docrm="${esc0(f.id)}" type="button">删除</button>`:''}</span></li>`).join('')}</ul>`:''}</section>`}
  async function download(id,btn){const f=FILES().find(x=>x.id===id);if(!f)return;const old=btn.textContent;btn.disabled=true;btn.textContent='下载中…';
    try{let buf=null;
      for(const u of ['files/'+id+'.bin?v='+f.t,`https://raw.githubusercontent.com/${REPO}/${BR}/${FDIR}${id}.bin?v=${f.t}`]){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){buf=new Uint8Array(await r.arrayBuffer());break}}catch(e){}}
      if(!buf)throw new Error('文件还没生成好，过 1–2 分钟再试');
      if(new TextDecoder().decode(buf.slice(0,5))!=='XZTF1')throw new Error('文件格式不对');
      const ak=await S().importKey('raw',unb64(f.k),'AES-GCM',false,['decrypt']);
      const pt=await S().decrypt({name:'AES-GCM',iv:buf.slice(5,17)},ak,buf.slice(17));
      const url=URL.createObjectURL(new Blob([pt],{type:f.type||'application/octet-stream'}));
      const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
      btn.textContent=old}
    catch(e){btn.textContent=old;alertBox(e.message||String(e))}
    finally{btn.disabled=false}}
  function alertBox(t){const n=document.createElement('div');n.className='pk-banner';n.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:80;max-width:92vw;background:var(--surface)';n.innerHTML=`<span>下载失败：${esc0(t)}</span>`;document.body.appendChild(n);setTimeout(()=>n.remove(),6000)}

  document.addEventListener('change',e=>{if(e.target&&e.target.id==='docFile'){const f=e.target.files&&e.target.files[0],n=document.getElementById('docFileName');if(n){n.textContent=f?`${f.name}（${fmtSize(f.size)}）`:'还没选文件';if(f)n.setAttribute('data-noi18n','');else n.removeAttribute('data-noi18n')}}});
  document.addEventListener('submit',e=>{if(e.target&&e.target.id==='svForm'){e.preventDefault();run()}});
  document.addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;const id=t.id;
    if(id==='siteSave')saveDlg();else if(id==='svCancel')closeSave();
    else if(id==='svForget'){try{LS.removeItem('xzt_gh')}catch(err){}dlg(DLG.kind,DLG);sm('已经从这个浏览器删掉了钥匙','ok');rerender()}
    else if(id==='docAdd')dlg('add');
    else{const b=t.closest('[data-docdl],[data-docrm]');if(!b)return;if(b.dataset.docdl)download(b.dataset.docdl,b);else dlg('del',{id:b.dataset.docrm})}});
  const boot=()=>{chip();saveBtn();const m=get('__mode');if(!m)gate(true);else if(m==='private')checkUpd()};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script>
/* 局域网同步：只在用电脑上的择校台服务器（http://电脑IP:8770）打开时启用；网页版、直接双击的单文件版不受影响 */
(function(){
  if(location.protocol!=='http:')return;
  const P='xzt.',SKIP=new Set(['xzt.theme','xzt.lang','xzt.view','xzt.__ts','xzt.__srv','xzt.__dev']);
  let LS;try{LS=window.localStorage}catch(e){return}
  const keys=()=>{const a=[];for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith(P)&&!SKIP.has(k))a.push(k)}return a};
  const snap=()=>{const o={};keys().forEach(k=>o[k]=LS.getItem(k));return o};
  const num=k=>+(LS.getItem(k)||0);
  const dev=(()=>{let d=LS.getItem('xzt.__dev');if(!d){const u=navigator.userAgent,t='ontouchend' in document;d=(/iPhone/.test(u)?'iPhone':/iPad/.test(u)||(/Macintosh/.test(u)&&t)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'设备')+'-'+Math.random().toString(36).slice(2,6);LS.setItem('xzt.__dev',d)}return d})();
  const S={on:false,busy:false,last:0,err:'',pending:false,newer:null,timer:0};
  function apply(st){const d=st.data||{};keys().forEach(k=>{if(!(k in d))LS.removeItem(k)});for(const k in d)if(k.startsWith(P)&&!SKIP.has(k))LS.setItem(k,d[k]);LS.setItem('xzt.__ts',String(st.ts||0));LS.setItem('xzt.__srv',String(st.serverTs||0))}
  /* 打开页面时先取一次电脑上的存档（同步请求，保证页面读到的是最新的） */
  try{const x=new XMLHttpRequest();x.open('GET','/api/state/xzt',false);x.send();
    if(x.status===200){const st=JSON.parse(x.responseText);S.on=true;S.last=Date.now();
      if(st.data&&(st.ts||0)>num('xzt.__ts'))apply(st);else if(num('xzt.__ts')>(st.ts||0)||(!st.data&&keys().length))S.pending=true}}catch(e){}
  if(!S.on)return;
  const hm=d=>{const z=n=>String(n).padStart(2,'0'),x=new Date(d);return z(x.getHours())+':'+z(x.getMinutes())};
  function ui(){let el=document.getElementById('syncChip');if(!el){const ld=document.getElementById('load');if(!ld)return;el=document.createElement('span');el.id='syncChip';ld.after(el)}
    if(S.newer){el.className='syncchip warn';el.innerHTML=`${(S.newer.dev||'另一台设备').split('-')[0]} 有更新 <button type="button" id="syncLoad">载入</button>`;el.title='另一台设备刚改过选择；点「载入」换成那边的版本';return}
    el.className='syncchip'+(S.err?' bad':S.pending||S.busy?' busy':'');el.innerHTML=`<button type="button" id="syncNow">${S.err?'⚠ '+S.err:S.busy?'同步中…':S.pending?'待同步':'✓ 已同步 '+hm(S.last)}</button>`;
    el.title=`局域网同步（这台设备：${dev}）。你在这里的选择会自动存到电脑上的「同步存档」，其他设备打开时自动取回。点一下立即同步。`}
  async function push(){if(S.busy){S.again=true;return}S.busy=true;ui();
    try{const body={ts:num('xzt.__ts')||Date.now(),dev,data:snap()};const r=await fetch('/api/state/xzt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
      LS.setItem('xzt.__srv',String(j.serverTs));S.pending=false;S.err='';S.newer=null;S.last=Date.now()}catch(e){S.err='同步失败，电脑上的服务器开着吗'}
    S.busy=false;ui();if(S.again){S.again=false;push()}}
  async function check(){if(S.busy)return;try{const r=await fetch('/api/state/xzt',{cache:'no-store'});const st=await r.json();S.err='';S.last=Date.now();S.newer=st.data&&(st.ts||0)>num('xzt.__ts')&&st.dev!==dev?st:null}catch(e){S.err='连不上电脑上的服务器'}ui()}
  function dirty(){LS.setItem('xzt.__ts',String(Date.now()));S.pending=true;clearTimeout(S.timer);S.timer=setTimeout(push,1200);ui()}
  document.addEventListener('click',e=>{if(e.target.id==='syncLoad'){apply(S.newer);location.reload();return}if(e.target.id==='syncNow'){S.pending?push():check()}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.pending)push();else check()}});
  setInterval(()=>{if(!document.hidden&&!S.pending)check()},30000);
  window.addEventListener('pagehide',()=>{if(S.pending){try{navigator.sendBeacon('/api/state/xzt',new Blob([JSON.stringify({ts:num('xzt.__ts'),dev,data:snap()})],{type:'application/json'}))}catch(e){}}});
  window.XSYNC={dirty,push,check,state:S,dev};
  ui();if(S.pending)setTimeout(push,300);
})();
</script>
<script>
/* 搬运我的选择：把这台设备浏览器里的全部选择打包成一串字，换网址或设备时粘过去 */
(function(){
  const P='xzt.',SKIP=new Set(['xzt.theme','xzt.lang','xzt.view','xzt.__ts','xzt.__srv','xzt.__dev']);
  const LS=()=>{try{return window.localStorage}catch(e){return null}};
  const $x=id=>document.getElementById(id);
  function snap(){const l=LS(),o={};if(!l)return o;for(let i=0;i<l.length;i++){const k=l.key(i);if(k&&k.startsWith(P)&&!SKIP.has(k))o[k]=l.getItem(k)}return o}
  const b64e=t=>{const u=new TextEncoder().encode(t);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)};
  const b64d=t=>{const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)};
  const pj=(v,d)=>{try{const x=JSON.parse(v);return x==null?d:x}catch(e){return d}};
  function summ(d){const n=k=>{const v=pj(d[P+k],null);return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:0};
    const t=pj(d[P+'tiers'],null),tr=t&&Array.isArray(t.rows)?t.rows.length:0;
    const a=[`我选的项目 ${n('cmp')} 个`,`不考虑 ${n('excl')} 个`,`分档 ${tr} 档`,`对比变量 ${n('tblCols')} 个`,`列筛选 ${n('tblCf')} 个`];
    return a.join(' · ')+`（共 ${Object.keys(d).length} 项设置）`}
  const pack=()=>'XZT1:'+b64e(JSON.stringify({v:1,t:Date.now(),d:snap()}));
  function unpack(txt){txt=String(txt||'').trim();if(!txt)throw new Error('还没粘贴内容');
    let o;const m=/XZT1:([A-Za-z0-9+/=\s]+)/.exec(txt);
    if(m)o=JSON.parse(b64d(m[1].replace(/\s+/g,'')));else o=JSON.parse(txt);
    const d=o&&typeof o.d==='object'?o.d:null;if(!d)throw new Error('这串字不是择校台的选择');
    const r={};for(const k in d)if(k.startsWith(P)&&!SKIP.has(k)&&typeof d[k]==='string')r[k]=d[k];

function varKind(v){
  if(v.t==='num')return 'num';
  if(D&&KIND[v.id])return KIND[v.id];
  const set=new Set();for(const x of ROWS){set.add(catOf(v,x));if(set.size>16)break}
  const k=set.size<=16?'chips':'kw'; if(D)KIND[v.id]=k; return k;
}
function varPass(v,f,x){
  const k=varKind(v);
  if(k==='num'){if(f.min===''&&f.max==='')return true;const val=v.get(x);if(val==null)return !!f.keepNA;if(f.min!==''&&val<+f.min)return false;if(f.max!==''&&val>+f.max)return false;return true}
  if(k==='chips'){return !f.sel.size||f.sel.has(catOf(v,x))}
  return !f.q||dispOf(v,x).toLowerCase().includes(f.q.toLowerCase());
}
function varActive(id){const f=VF[id];if(!f)return false;return f.min!==''||f.max!==''||f.sel.size>0||!!f.q}
function pass(x,skip){
  if(EXCL.has(x.seq)&&!S.showExcl)return false;
  if(fOn('hide')&&S.hideClosed&&x.closed)return false;
  if(S.q){const q=S.q.toLowerCase();if(!x.text.includes(q)&&!(x.facText&&x.facText.includes(q)))return false}
  for(const g of G){if(g.id===skip||!fOn(g.id))continue;const s=S[g.id];if(s.size&&!s.has(g.f(x)))return false}
  if(fOn('stip')&&S.stipMin>0){if(x.stip==null){if(!S.stipKeepNA)return false}else if(x.stip<S.stipMin)return false}
  if(fOn('cats')&&skip!=='cats'&&S.cats.size){for(const c of S.cats){if((x.cats[c]||0)<S.catMin)return false}}
  if(fOn('test')&&skip!=='test'&&S.lt.test&&!ltPass(x))return false;
  if(fOn('fmax')&&S.field&&S.fieldMax>0){const f=x.fld&&x.fld[S.field];if(!f||f.v==null||f.v>S.fieldMax)return false}
  for(const id of FL){if(!id.startsWith('v:'))continue;const k=id.slice(2);if(k===skip)continue;const f=VF[k],v=VARBY[k];if(f&&v&&!varPass(v,f,x))return false}
  return true;
}

}
function blockV(k,i){
  const v=VARBY[k]; if(!v)return `<div class="fgroup">${fHead('v:'+k,k,i)}<p class="small muted" style="margin:0">数据载入后可用…</p></div>`;
  const f=VF[k]||(VF[k]={min:'',max:'',keepNA:false,sel:new Set(),q:''}); const kind=varKind(v);
  let h=`<div class="fgroup">${fHead('v:'+k,v.l,i)}<div class="small muted" style="margin:-4px 0 6px">${esc(v.g)}</div>`;
  if(kind==='num'){

      <p class="small muted" style="margin:4px 0 0">现有范围 ${esc(show(lo))}–${esc(show(hi))}，${vals.length} 个项目有数据${/占比|率/.test(v.l)?'；比例按小数输入，如 0.5＝50%':''}${v.id==='dl'?'；日期按 20261201 这样输入':''}</p>
      <label class="frow small muted"><input type="checkbox" data-vna="${esc(k)}" ${f.keepNA?'checked':''}> 没有这项数据的也保留</label>`;
  } else if(kind==='chips'){

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(series,h=250,from=2010,to=2027){
  const all=series.flatMap(s=>s.segs.flat());
  if(!all.length)return '<p class="note">所选的榜 2010 年后都没有名次记录。</p>';
  let lo=Math.min(...all.map(p=>p.v)),hi=Math.max(...all.map(p=>p.v));
  const st=niceStep(Math.max(hi-lo,4)/4); lo=Math.max(1,Math.floor((lo-st*.3)/st)*st||1); hi=Math.ceil((hi+st*.3)/st)*st; if(lo<1)lo=1;
  const W=720,Lp=42,Rp=40,T=12,B=26,iw=W-Lp-Rp,ih=h-T-B;
  const X=y=>Lp+(y-from)/(to-from)*iw, Y=v=>T+(v-lo)/(hi-lo||1)*ih;
  let g='';
  const ticks=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)ticks.push(v); if(!ticks.includes(1)&&lo<=1)ticks.unshift(1);
  for(const v of ticks){g+=`<line class="grid" x1="${Lp}" x2="${W-Rp}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${Lp-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  for(let y=from;y<=to;y+=1){if(y%2===0||y===to)g+=`<text x="${X(y)}" y="${h-8}" text-anchor="middle">${String(y).slice(2)}</text>`}
  for(const s of series){
    for(const seg of s.segs){
      if(seg.length>1)g+=`<path d="${seg.map((p,i)=>(i?'L':'M')+X(p.yr).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}" fill="none" style="stroke:var(${s.c})" stroke-width="2" stroke-linejoin="round"${s.c==='--s10'?' stroke-dasharray="6 4"':''}/>`;
      for(const p of seg){const range=!/^\d+$/.test(p.raw);g+=`<circle cx="${X(p.yr).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${range?3.6:3}" style="fill:${range?'var(--surface)':`var(${s.c})`};stroke:var(${s.c})" stroke-width="1.6"><title>${esc(s.n)} ${esc(p.lab)}：第 ${esc(p.raw)} 名</title></circle>`}
    }
    const lp=s.segs.flat().slice(-1)[0]; if(lp&&series.length<=5)g+=`<text x="${X(lp.yr)+6}" y="${Y(lp.v)+4}" style="fill:var(${s.c})">${esc(lp.raw)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="排名走势图，纵轴为名次，越往上越好">${g}</svg><p class="note">纵轴是名次，越往上越好；横轴是年份（后两位）；空心点是区间名次（按中点画）或带 ≈ 的推算名次；线断开的地方是那几年没上榜。</p>`;
}
function yearSegs(obj){const ys=Object.keys(obj||{}).sort();const out=[];let cur=[];let prev=null;for(const y of ys){const raw=obj[y];const v=mid(raw);if(v==null)continue;if(prev!=null&&+y-prev>1){if(cur.length)out.push(cur);cur=[]}cur.push({yr:+y,v,raw:String(raw),lab:y});prev=+y}if(cur.length)out.push(cur);return out}
function bars(obj,fmt){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));const tot=e.reduce((a,x)=>a+x[1],0);return `<div class="bars">${e.map(([k,v])=>`<span>${esc(k)}</span><div class="bar" style="width:${(v/mx*100).toFixed(1)}%"></div><span class="mono small">${fmt?fmt(v):tot?`${pct(v/tot)}／${v}`:v}</span>`).join('')}</div>`}

const groupBy=(arr,fn)=>{const g={};for(const a of arr){const k=fn(a);(g[k]=g[k]||[]).push(a)}return g};

function renderPC(view,groups,metrics,o={}){

  if(!D||!ADM){el.innerHTML=`<div class="empty" style="grid-column:1/-1">正在载入录取数据…</div>`;while(!D)await new Promise(r=>setTimeout(r,200));await loadADM();if(VIEW!=='adm')return}
  el.innerHTML=`<aside class="filters" id="admF"></aside><section style="min-width:0"><p class="intro">各项目官网、研究生院统计页和仪表板公布的申请数、录取数、入学数、录取率、国际生比例和录取者 GRE，以及学校层面的录取者画像（GPA、GRE、数学课、研究经历）。总表是多年中值；「详细」里看逐年数字、口径和来源。官网没公布的写「—」。</p>
    <div class="search" style="margin-bottom:10px"><input id="admQ" type="search" placeholder="搜学校、项目或口径说明（如 dashboard、HBS、均值）" value="${esc(AS.q)}"></div><div id="admR"></div></section>`;
  renderAdmFilters(); renderAdmResults();
}
function renderAdmFilters(){
  const el=document.getElementById('admF'); if(!el)return;
  const cnt=(skip,fn)=>countBy(ROWS.map(x=>x.seq).filter(s=>admPass(s,skip)),fn);
  const hc={};for(const [h] of ADMH)hc[h]=ROWS.filter(x=>admPass(x.seq,'has')&&admHas(x.seq,h)).length;
  const cc=cnt('cred',s=>String(D?.admit?.[s]?.['可信度']||'—').trim()[0]||'—'),uc=cnt('usn',s=>GID('usn').f(BY[s])),rc=cnt('reg',s=>BY[s].reg);
  const pc=countBy((ADM||[]).filter(a=>admPass(a.seq,'prog')&&hasNum(a)),a=>a.seq),pt=countBy((ADM||[]).filter(hasNum),a=>a.seq);
  el.innerHTML=`<div class="ftools"><b>筛选项目</b><button class="linkbtn" id="admClr">全部清空</button></div>
   <div class="fgroup"><h4>项目</h4><select id="admProg" class="sel">${progOptions(AS.prog,pc,pt)}</select><p class="small muted" style="margin:4px 0 0">括号（x/y）＝有数字的逐年记录条数</p></div>
   <div class="fgroup"><h4>有哪些数据（可多选，同时满足）</h4><div class="chips">${ADMH.map(([h,l])=>`<button class="chip" data-ah="${h}" aria-pressed="${AS.has.has(h)}">${l}<span class="n">${hc[h]}</span></button>`).join('')}</div></div>

   <div class="fgroup"><h4>US News 经济学排名</h4><div class="chips">${GID('usn').o.map(([v,l])=>`<button class="chip" data-au="${v}" aria-pressed="${AS.usn.has(v)}">${l}<span class="n">${uc[v]||0}</span></button>`).join('')}</div></div>

function renderAdmResults(){
  const el=document.getElementById('admR'); if(!el)return;
  const seqs=ROWS.map(x=>x.seq).filter(s=>admPass(s,'prog'));
  const G=Object.fromEntries(seqs.map(s=>[s,(ADM||[]).filter(a=>a.seq===s)]));
  const pick=seqs.filter(s=>!AS.prog||s===AS.prog);
  const rowsY=(ADM||[]).filter(a=>pick.includes(a.seq)&&hasNum(a)).sort((a,b)=>(b.y||0)-(a.y||0)||parseInt(a.seq)-parseInt(b.seq));
  const per=60,pages=Math.max(1,Math.ceil(rowsY.length/per)); AS.page=Math.min(AS.page,pages-1);
  const profS=[...new Set(pick.map(s=>String(parseInt(s))))].filter(b=>(D?.profile?.[b]||[]).length);
  const nNum=seqs.filter(s=>AD(s,'申请数（中值）')!=null||AD(s,'录取率')!=null).length;
  el.innerHTML=`<div class="listhead"><span class="count">${seqs.length} 个项目 · 其中 ${nNum} 个公布了申请数或录取率</span><button class="btn fbtn" data-fb="admF">筛选</button></div>
   ${renderPC('adm',G,ADM_M,{title:'按项目对比',note:'数字是总表的多年中值；详细里是逐年数字、口径与来源。'})}
   <h3 style="margin:18px 0 6px;font-size:15px">逐年明细（${rowsY.length} 条有数字的记录${AS.prog?'，'+esc(progName(AS.prog)):''}）</h3>
   <div class="tscroll" style="max-height:60vh"><table class="t"><thead><tr><th>项目</th><th>入学年份</th><th>年份类型</th><th class="num">申请</th><th class="num">录取</th><th class="num">入学</th><th class="num">录取率</th><th class="num">录取后入学率</th><th class="num">录取者国际生</th><th class="num">GRE Q</th><th class="num">GRE V</th><th>可信度</th><th>口径说明</th><th>来源</th></tr></thead><tbody>${rowsY.slice(AS.page*per,AS.page*per+per).map(a=>`<tr><td>${progLink(a.seq)}</td><td class="small">${esc(a.r[7]||a.y||'—')}</td><td class="small">${esc(a.type)}</td><td class="num">${rng(a.app)}</td><td class="num">${rng(a.adm)}</td><td class="num">${rng(a.enr)}</td><td class="num">${a.rate!=null?pct(a.rate):''}</td><td class="num">${a.yld!=null?pct(a.yld):''}</td><td class="num">${a.intlA!=null?pct(a.intlA):''}</td><td class="num">${a.gq??''}</td><td class="num">${a.gv??''}</td><td class="small">${esc(a.cred)}</td><td class="small"><div class="cell">${esc(a.note)}</div></td><td class="small">${linkify(a.src)}</td></tr>`).join('')||'<tr><td colspan="14" class="muted">没有逐年数字</td></tr>'}</tbody></table></div>${pager(AS.page,pages,rowsY.length,'条')}
   <h3 style="margin:18px 0 6px;font-size:15px">录取者画像（学校层面，${profS.length} 所）</h3>
   <div class="tscroll" style="max-height:60vh"><table class="t"><thead><tr><th>学校</th><th>GPA</th><th>GRE 数学</th><th>GRE 语文／写作</th><th>数学课背景</th><th>研究经历与其他</th><th>国际生</th><th>口径与年份</th><th>可信度</th><th>来源</th></tr></thead><tbody>${profS.flatMap(b=>D.profile[b].map(p=>`<tr><td>${esc(BY[b]?.r[K.school]||b)}</td>${['GPA','GRE 数学','GRE 语文/写作','数学课背景','研究经历与其他','国际生','口径与年份','可信度'].map(k=>`<td class="small"><div class="cell">${esc(p[k]||'')}</div></td>`).join('')}<td class="small">${linkify(p['来源']||'')}</td></tr>`)).join('')||'<tr><td colspan="10" class="muted">没有画像</td></tr>'}</tbody></table></div>`;
}
PCRR.adm=()=>renderAdmResults(); PCPICK.adm=s=>{AS.prog=s;AS.page=0;renderAdmFilters();renderAdmResults()};
document.getElementById('view-adm').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.od||b.dataset.pcv)return;
  if(b.id==='admClr'){Object.assign(AS,{q:'',prog:'',page:0});['has','cred','usn','reg'].forEach(k=>AS[k].clear());renderAdmView();return}
  const tog=(set,v)=>{set.has(v)?set.delete(v):set.add(v);AS.page=0;renderAdmFilters();renderAdmResults()};
  if(b.dataset.ah)return tog(AS.has,b.dataset.ah); if(b.dataset.ac)return tog(AS.cred,b.dataset.ac); if(b.dataset.au)return tog(AS.usn,b.dataset.au); if(b.dataset.ar)return tog(AS.reg,b.dataset.ar);
  if(b.dataset.pg){AS.page+=+b.dataset.pg;renderAdmResults();return}
});
let aT; document.getElementById('view-adm').addEventListener('input',e=>{if(e.target.id==='admQ'){clearTimeout(aT);const v=e.target.value.trim();aT=setTimeout(()=>{AS.q=v;AS.page=0;renderAdmFilters();renderAdmResults()},240)}});
document.getElementById('view-adm').addEventListener('change',e=>{if(e.target.id==='admProg'){AS.prog=e.target.value;AS.page=0;renderAdmFilters();renderAdmResults()}});

function fieldRowsOf(seq){const p=PR?.[seq];if(!p)return [];return p.fields.map(f=>{const ys=f[3]||{};const yrs=Object.keys(ys).sort();return {code:f[0],cn:f[1],cat:f[2],big:FIELD2CAT[f[0]]||'其他',ys,last:f[4],rank:f[5],v:mid(f[5]),n:yrs.length,first:yrs[0]?mid(ys[yrs[0]]):null}})}
function renderFieldProg(){
  const el=$('#fvMain'); const seq=FV.seq;
  if(!PR){el.innerHTML='<p class="note">RePEc 分领域名次载入中…</p>';return}
  if(!seq||!PR[seq]){el.innerHTML='<div class="empty">在左边选一个项目，看它在每个 RePEc 领域的名次。</div>';return}
  const p=PR[seq]; let F=fieldRowsOf(seq); store.set('fvSeq',seq); F.forEach(f=>f.c=chgOf(yearSegs(f.ys).flat(),FLDMAX[f.code]||2026));
  const cur=F.filter(f=>f.last==='2026');
  const k=FV.psort||'rank'; const d=FV.pdir||1;
  const key={rank:f=>f.v??9999,big:f=>CATS.indexOf(f.big)*1e4+(f.v??9999),n:f=>-f.n,chg:f=>f.c?.dv!=null?-f.c.dv:9999}[k]||(f=>f.v??9999);
  F.sort((a,b)=>(key(a)-key(b))*d||(a.v??9999)-(b.v??9999));
  const years=[...new Set(F.flatMap(f=>Object.keys(f.ys)))].sort();
  const byBig=groupBy(F,f=>f.big); const bigRows=Object.entries(byBig).map(([b,A])=>{const best=A.slice().sort((x,y)=>(x.v??9999)-(y.v??9999))[0];return {b,n:A.length,n26:A.filter(f=>f.last==='2026').length,best}}).sort((a,b)=>(a.best.v??9999)-(b.best.v??9999));
  const top=F.filter(f=>f.last==='2026').slice().sort((a,b)=>(a.v??9999)-(b.v??9999)).slice(0,8);
  const ser=top.map((f,i)=>({n:`${f.code} ${f.cn}`,c:`--s${i+1}`,segs:yearSegs(f.ys)}));
  const th=(kk,l,cls='')=>`<th class="${cls}"><button class="linkbtn tbsort" data-fvs="${kk}">${l}${k===kk?(d>0?' ↑':' ↓'):''}</button></th>`;
  el.innerHTML=`<h2 style="font-family:var(--f-disp);margin:0 0 4px;font-size:21px"><span class="seq">${esc(seq)}</span> ${esc(progName(seq))}</h2>
   <div class="small muted">RePEc 单位：${esc(p.name)}（${esc(p.id)}）· 历年在 ${F.length} 个领域上过榜，2026 年在 ${cur.length} 个领域上榜 · <button class="linkbtn" data-od="${esc(seq)}">打开项目详情</button></div>
   <div class="sumgrid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="box"><h4>按方向大类（最好名次）</h4><div class="minit">${bigRows.map(r=>`<span class="small">${esc(r.b)} <span class="mono muted">${r.n26}/${r.n}</span>：<button data-fvgo="${esc(r.best.code)}">${esc(r.best.code)} ${esc(r.best.cn)}</button></span><span>${r.best.c?chgHTML(r.best.c,{spark:false}):'第 '+esc(r.best.rank)}</span>`).join('')}</div><p class="note">大类后「x/y」：x＝2026 年上榜的领域数，y＝历年上过榜的领域数；右边是这一大类里最近名次最好的领域：第一次上榜 → 最近一次上榜的名次和进退几名。</p></div>
   <div class="box"><div class="legend">${ser.map(s=>`<span class="lg"><i style="background:var(${s.c})"></i>${esc(s.n)}</span>`).join('')}</div>${ser.length?lineChart(ser,220):'<p class="note">2026 年没有上榜的领域。</p>'}</div></div>
   <div class="cmp-tools" style="margin:12px 0 8px">${fvSeg()}<span class="small muted">排序：</span>${th('rank','按最新名次').replace(/^<th class="">|<\/th>$/g,'')}<span class="muted">·</span>${th('chg','按进步名次').replace(/^<th class="">|<\/th>$/g,'')}</div>
   <div class="tscroll" style="max-height:65vh"><table class="t"><thead><tr><th>领域</th>${th('big','方向大类')}<th>起止名次与变化</th>${FV.full?years.map(y=>`<th class="num">${esc(y.slice(2))}</th>`).join(''):''}${th('n','上榜年数','num')}</tr></thead><tbody>${F.map(f=>`<tr><td><button class="linkbtn" data-fvgo="${esc(f.code)}"><span class="mono">${esc(f.code)}</span> ${esc(f.cn)}</button></td><td class="small">${esc(f.big)}</td><td>${chgHTML(f.c,{w:90,h:20})||'—'}</td>${FV.full?years.map(y=>`<td class="num">${esc(f.ys[y]??'')}</td>`).join(''):''}<td class="num">${f.n}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">点领域名跳到「按领域看」那一页。「起止」＝第一次上榜（2010 年起）→ 最近一次上榜的名次，↑ 进步几名、↓ 退步几名；「之后未上榜」＝最近几年跌出这个领域的榜。「简洁」只看起止，「详细」再加上每一年的名次。</p>`;
}

    let tsv=tbLay(L.length)==='cols'

      :[['序号','学校','项目',...(TGRP?['分档']:[]),...(CFFAIL.size?['是否满足列筛选']:[]),...vis.map(v=>v.l)].join('\t'),...L.map(x=>[x.seq,x.r[K.school],pj(x),...(TGRP?[(i=>i<0?'不在任何一档':`第 ${i+1} 档 ${tierName(TIER.rows[i])}`+((L=>L?`（${L===1?'一级':'二级'}）`:'')(tierStat().LV[x.seq])))(tierOf(x))]:[]),...(CFFAIL.size?[CFFAIL.has(x.seq)?'不满足：'+nmLab(x.seq):'满足']:[]),...vis.map(v=>cellTxt(v,x))].map(clean).join('\t'))].join('\n');

  }

function pickFacts(x){const F=[];const add=(l,id,n)=>{const v=VARBY[id];if(!v)return;let d;try{d=dispOf(v,x)}catch(e){d='—'}if(!d||d==='—'||/载入中/.test(d))return;F.push([l,cut(d,n||60)])};
  add('截止','dl',40);const dl=VARBY.days;if(dl){const g=dl.get(x);if(g!=null&&F.length)F[F.length-1][1]+=` · 还剩 ${g} 天`}
  add('GRE','gre',50);add('一年制美硕免语言','lang',50);add('认可的考试','langAll',60);
  const st=VARBY.stip?.get(x);if(st!=null)F.push(['年津贴',fmtMoney(st)]);else add('资助','fund',60);
  add('招生规模','size',50);add('申请／录取／入学','admTri',50);add('毕业去向·教职','acr',50);add('在读·大陆本科','cnstu',50);add('人数最多的方向','topcat',60);add('面试','iv',40);add('申请费','fee',20);
  return F}
function pickCard(x,lv){const r=x.r;const usn=VARBY.usn?.get(x),rep=VARBY.rep?.get(x);const tip=String(r[K.tip]||'').trim(),ask=String(r[K.ask]||'').trim();
  return `<div class="pk-card${lv===2?' l2':''}"><div class="pk-top"><span class="seq">${esc(x.seq)}</span><button class="sch" data-od="${esc(x.seq)}">${esc(r[K.school])}</button><span class="prj">${esc(String(r[K.proj]).replace('｜',' · '))} · ${esc(r[K.loc])}</span>
    <span class="rk">${usn!=null?`US News 第 ${esc(usn)}`:'US News 无名次'}${rep!=null?` · RePEc 第 ${esc(rep)}`:''}<span class="pk-acts"><button class="btn" data-od="${esc(x.seq)}">详情</button>${window.XZT_SITE&&store.get('__mode','')!=='private'?'':`<button class="btn" data-pkrm="${esc(x.seq)}" title="移出我选的项目">移出</button>`}</span></span></div>
    ${briefHTML(x)}
    ${tip&&tip!=='—'?`<p class="pk-tip">💡 ${esc(cut(tip,220))}</p>`:''}${ask&&ask!=='—'?`<p class="pk-ask">⚠️ 投递前写信确认：${esc(cut(ask,200))}</p>`:''}</div>`}
let PKLOAD=false;
window.renderPickNow=()=>{if(VIEW==='pick')renderPick()};
function renderPick(){const el=$('#view-pick');if(!el)return;needStu();
  if(!PKLOAD){PKLOAD=true;const L=[typeof loadFAC==='function'&&loadFAC(),typeof loadSTU==='function'&&loadSTU(),typeof loadPLC==='function'&&loadPLC(),typeof loadADM==='function'&&loadADM()].filter(Boolean).map(x=>x&&x.catch?x.catch(()=>0):x);Promise.all(L).then(()=>{if(VIEW==='pick')renderPick()})}

  const S0=window.XZT_SITE,mode=S0?store.get('__mode',''):'';
  let ban='';
  if(S0&&mode==='private'){const t=store.get('__privts',0);const dt=!!store.get('__dirty',0);ban=`<div class="pk-banner"><span>🔒 私人访问 · 这份选校清单保存于 <b>${t?esc(new Date(+t).toLocaleString()):'—'}</b>。${dt?'<b>这里有还没保存的改动。</b>':''}在网页上做的改动先存在这个浏览器里；点「保存到网站」后，所有人才会看到（需要网站主人的 GitHub 钥匙）。</span><button class="btn${dt?' pri':''}" id="pkSave">保存到网站</button><button class="btn" id="pkGate">重新输入密码／退出</button></div>`}
  else if(S0){ban=`<div class="pk-banner"><span>这是游客浏览：清单是空的，你可以在「择校」页点「加入对比」挑自己的项目。要看申请人的选校清单，请用私人访问（需要密码）。</span><button class="btn" id="pkGate">私人访问</button></div>`}

  if(!sel.length){el.innerHTML=`${ban}<div class="pk-head"><h2>我的选校清单</h2></div>${docs}<p class="note">还没有选项目。在「择校」页点项目右边的「加入对比」，或者在「自选对比」页搜索加入。</p>`;return}

  const ex=[...EXCL].map(s=>BY[s]).filter(Boolean);
